name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Linux keyring test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gnome-keyring dbus
      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: go test ./...
      - name: Test (Linux with Secret Service)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dbus-run-session -- bash -euo pipefail <<'KEYRING_TEST'
          printf '%s' "$(openssl rand -hex 32)" | gnome-keyring-daemon --unlock --components=secrets
          go test ./...
          KEYRING_TEST
      - name: Vet
        run: go vet ./...
